name: Bulk Snapshot Match

# Monthly offline recovery pass over the no_match backlog using the free CH
# bulk data product (~5.5M companies incl. previous names + PostTown). Removes
# the nightly sweep's two search-API constraints (20-result window, request
# budget): catches typo'd names the search returns nothing for, matches ranked
# below the cutoff, and renames only visible via previous names. Every winner
# is re-verified against the live CH API before committing, so snapshot
# staleness can never write a wrong mapping. Runs on the 3rd (the snapshot
# publishes in the first days of the month) at midday, clear of the nightly
# sweep window; the shared concurrency group serialises against the tiers.

on:
  schedule:
    - cron: '19 12 3 * *'
  workflow_dispatch:
    inputs:
      max-verifications:
        description: 'Cap on live CH verifications/commits (default 2500)'
        required: false
        type: number
      dry-run:
        description: 'Dry run — full pipeline, no DB writes'
        type: boolean
        default: false

concurrency:
  group: phase5-sweep
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      COMPANIES_HOUSE_SEED_API_KEY: ${{ secrets.COMPANIES_HOUSE_SEED_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        shell: bash
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run bulk snapshot match
        shell: bash
        env:
          MAX_VERIFICATIONS: ${{ github.event.inputs.max-verifications }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          VERIFY_FLAG=""
          if [ -n "$MAX_VERIFICATIONS" ]; then
            VERIFY_FLAG="--max-verifications=$MAX_VERIFICATIONS"
          fi
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          set -o pipefail
          bun apps/web/scripts/bulk-snapshot-match.ts $VERIFY_FLAG $DRY_FLAG | tee /tmp/bulk-snapshot.log

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          LOG=/tmp/bulk-snapshot.log
          if [ ! -f "$LOG" ]; then exit 0; fi
          extract() { grep -E "^  $1 +:" "$LOG" | tail -n1 | sed -E "s/^  $1 +: //" || true; }
          {
            echo "## Bulk Snapshot Match"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| 🎯 Backlog | $(extract backlog) |"
            echo "| 🔍 Orgs matched | $(extract orgs_matched) |"
            echo "| ⚖️ Tied/ambiguous | $(extract tied_ambiguous) |"
            echo "| 📞 Verified live | $(extract verified_confirmed) |"
            echo "| 🚫 Verify mismatch | $(extract verify_mismatch) |"
            echo "| ✅ Committed | $(extract committed) |"
            echo "| 🧪 Dry-run would commit | $(extract dry_run_would_commit) |"
            echo "| ⏭️ Capped out | $(extract capped_out) |"
            echo "| 🔒 Lock missed | $(extract lock_missed) |"
            echo "| ❌ Errored | $(extract errored) |"
            echo "| ⏱️ Duration | $(extract duration) |"
          } >> "$GITHUB_STEP_SUMMARY"
