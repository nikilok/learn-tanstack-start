name: Desktop App

on:
  push:
    tags: ['v*'] # vX.Y.Z -> signed, notarized release published to GitHub Releases
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch: # manual unsigned matrix smoke build (no publish)

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Fast packaging check on desktop PRs — Linux only, unsigned, no publish.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Compile main/preload
        working-directory: apps/desktop
        run: bunx electron-vite build
      - name: Package (unsigned, no publish)
        working-directory: apps/desktop
        run: bunx electron-builder --linux --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  release:
    # Tagged push (vX.Y.Z) -> sign + notarize + publish. Manual dispatch -> unsigned matrix smoke.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # create the GitHub Release and upload installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Compile main/preload
        working-directory: apps/desktop
        run: bunx electron-vite build

      - name: Build, sign & publish (tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        run: bunx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code-signing cert per platform (Developer ID .p12 on mac, .pfx on win).
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || (matrix.platform == 'win' && secrets.WIN_CSC_LINK || '') }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || (matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '') }}
          # macOS notarization (ignored on other runners).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (manual dispatch — unsigned, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/desktop
        run: bunx electron-builder --${{ matrix.platform }} --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
