name: Desktop App

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      # Docs-only edits (routine now that release notes live in CHANGELOG.md)
      # don't need the packaging smoke.
      - '!apps/desktop/CHANGELOG.md'
      - '!apps/desktop/README.md'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
    inputs:
      # Manual re-release: rebuild an ALREADY-RELEASED version for a chosen set of OSes
      # WITHOUT a semver bump — the version job is skipped and the build job checks out
      # the existing v<version> tag. Leave unchecked for a normal semver-bump release.
      manual:
        description: 'Rebuild an existing version (no version bump)'
        type: boolean
        required: false
        default: false
      manual_version:
        description: 'Existing version to rebuild, e.g. 0.1.5 (required when "Rebuild an existing version" is checked)'
        type: string
        required: false
      build_mac:
        description: 'Build macOS'
        type: boolean
        required: false
        default: true
      build_win:
        description: 'Build Windows'
        type: boolean
        required: false
        default: true
      build_linux:
        description: 'Build Linux'
        type: boolean
        required: false
        default: false
      release_type:
        description: 'Semver bump (bump mode only — ignored when rebuilding an existing version)'
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      release_notes:
        # Single-line field (GitHub has no textarea input type). Empty ⇒ ship +
        # archive CHANGELOG.md's Unreleased section; non-empty ⇒ override verbatim.
        # Full flow: apps/desktop/README.md. Multiline override:
        # `gh workflow run desktop-release.yml -f release_type=patch -f release_notes="$(cat notes.md)"`.
        # Bump mode only — ignored when rebuilding an existing version.
        description: 'Release notes override (markdown, optional) — empty ships CHANGELOG.md "Unreleased" (bump mode only)'
        type: string
        required: false

concurrency:
  # Never cancel a release mid-publish; PR smokes are cheap to let finish too.
  # ALL release dispatches (bump + manual, from ANY ref) share ONE group so they
  # serialize — a manual re-release and a bump from different refs would otherwise run in
  # parallel and race the overwritten downloads/latest/ feed (one could roll the other's
  # latest*.yml back). PR smokes stay per-ref so they run in parallel across PRs.
  group: desktop-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: false

# Least privilege by default; only the version job opts up to contents: write.
permissions:
  contents: read

jobs:
  smoke:
    # Fast packaging check on desktop PRs — Linux only, unsigned, no publish.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Compile main/preload
        working-directory: apps/desktop
        run: bunx electron-vite build
      - name: Package (unsigned, no publish)
        working-directory: apps/desktop
        # Real AppImage target (not --dir): --dir skips target packaging, which
        # hid the '@ssdesktop' executableName failure until the first release.
        run: bunx electron-builder --linux AppImage --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  resolve:
    # Validate the dispatch, decide bump-vs-manual, and compute the build fan-out.
    # Fast read-only gate so a bad input fails BEFORE any bump/tag/PR happens.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }} # bump | manual
      matrix: ${{ steps.plan.outputs.matrix }} # JSON array for the build matrix include:
      effective_version: ${{ steps.plan.outputs.effective_version }} # manual mode only
      skip_feed: ${{ steps.plan.outputs.skip_feed }} # 'true' | 'false'
    steps:
      # Bump releases squash-merge the dispatched ref into main via the version job's
      # PR, so they MUST come from main. Manual re-releases do no bump/PR and build from
      # an immutable tag, so they're allowed from any ref (Linux build-fix iteration).
      - name: Refuse non-main bump dispatches
        if: ${{ !inputs.manual && github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::Semver-bump releases dispatch from main only (the bump PR squash-merges '$REF' into main). For a re-release, tick 'Rebuild an existing version'."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-tags: true # default checkout can't see v* tags (existence + highest-tag)
          persist-credentials: false
      - name: Plan release
        id: plan
        env:
          MANUAL: ${{ inputs.manual }}
          MANUAL_VERSION: ${{ inputs.manual_version }}
          BUILD_MAC: ${{ inputs.build_mac }}
          BUILD_WIN: ${{ inputs.build_win }}
          BUILD_LINUX: ${{ inputs.build_linux }}
        run: |
          set -euo pipefail
          # OS fan-out — applies to BOTH modes; booleans render as true/false → --argjson.
          matrix=$(jq -cn \
            --argjson mac "$BUILD_MAC" \
            --argjson win "$BUILD_WIN" \
            --argjson linux "$BUILD_LINUX" \
            '[ if $mac   then {os:"macos-latest",platform:"mac"}    else empty end,
               if $win   then {os:"windows-latest",platform:"win"}  else empty end,
               if $linux then {os:"ubuntu-latest",platform:"linux"} else empty end ]')
          if [ "$(printf '%s' "$matrix" | jq 'length')" -eq 0 ]; then
            echo "::error::Select at least one OS (build_mac / build_win / build_linux)."
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          if [ "$MANUAL" = "true" ]; then
            ver="${MANUAL_VERSION#v}" # tolerate a typed leading 'v'
            if [ -z "$ver" ]; then
              echo "::error::Manual mode needs manual_version (e.g. 0.1.5)."
              exit 1
            fi
            if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$'; then
              echo "::error::manual_version '$ver' is not a valid version."
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/v${ver}" >/dev/null; then
              echo "::error::Tag v${ver} does not exist — nothing to re-release."
              exit 1
            fi
            # Only touch the overwritten updater feed (downloads/latest/) when this IS the
            # newest release — rebuilding an OLD version must never downgrade live updaters.
            # Compare against the highest STABLE tag only (bare vX.Y.Z): `sort -V`
            # misorders prerelease suffixes (v0.1.5-hotfix sorts AFTER v0.1.5), which would
            # wrongly trip the guard when re-releasing the true latest.
            highest="$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
            if [ "v${ver}" = "$highest" ]; then
              skip_feed=false
            else
              skip_feed=true
              echo "::warning::v${ver} is not the latest tag ($highest) — the auto-update feed (downloads/latest/) will NOT be touched (no downgrade)."
            fi
            {
              echo "mode=manual"
              echo "effective_version=${ver}"
              echo "skip_feed=${skip_feed}"
            } >> "$GITHUB_OUTPUT"
          else
            # Any subset is allowed in a bump too (ship one platform if you want). Just
            # WARN — never block — when mac or win is dropped: a bump advances main's
            # version for everyone, so the unbuilt platform(s) stay on the previous
            # version's updater feed until a manual re-release of this version builds them.
            if [ "$BUILD_MAC" != "true" ] || [ "$BUILD_WIN" != "true" ]; then
              echo "::warning::This bump isn't building all of mac+win — the unbuilt platform(s) stay on the previous version until you re-release this version for them."
            fi
            {
              echo "mode=bump"
              echo "effective_version="
              echo "skip_feed=false"
            } >> "$GITHUB_OUTPUT"
          fi

  version:
    # Bump apps/desktop version once on a release branch, tag that commit (the build
    # jobs check the tag out immediately), and PR the bump back to protected main.
    # Main dispatches only — the bump PR would merge any other ref into main wholesale.
    # Bump mode only: a manual re-release skips this entirely and rebuilds an existing tag.
    needs: resolve
    if: needs.resolve.outputs.mode == 'bump'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch + tag
      pull-requests: write # open + auto-merge the version-bump PR
    env:
      # CHANGELOG.md section headers the workflow owns (ERE, read by every awk
      # via ENVIRON so the extract/archive/verify passes can't drift apart).
      HDR_RE: '^## \[?Unreleased\]?[[:space:]]*$'
      VER_RE: '^## v[0-9]'
    outputs:
      version: ${{ steps.bump.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      # Defense-in-depth (normally unreachable): resolve already refuses non-main bumps
      # and this job only runs in bump mode, so github.ref is provably main here. Kept as
      # the last guard on this job's contents:write push/tag/PR-merge into protected main
      # if resolve's gate is ever weakened — keep it in lockstep with resolve's
      # "Refuse non-main bump dispatches".
      - name: Refuse non-main dispatches
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::Dispatch releases from main only — the bump PR squash-merges the dispatched ref into main, so '$REF' would land there wholesale."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Bump version
        id: bump
        working-directory: apps/desktop
        run: |
          bun pm version ${{ inputs.release_type }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped @ss/desktop to $VERSION"
      - name: Resolve release notes (input overrides CHANGELOG.md Unreleased)
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.release_notes }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          CHANGELOG=apps/desktop/CHANGELOG.md
          # Body of Unreleased up to the next WORKFLOW-OWNED header (## vX…), so
          # authors may use "## Fixed"-style subheadings without truncating notes.
          extract() { awk '$0 ~ ENVIRON["HDR_RE"] {f=1; next} $0 ~ ENVIRON["VER_RE"] || $0 ~ ENVIRON["HDR_RE"] {f=0} f' "$CHANGELOG"; }
          INPUT_TRIMMED="$(printf '%s' "$INPUT_NOTES" | tr -d '[:space:]')"
          ARCHIVED=false
          if [ -n "$INPUT_TRIMMED" ]; then
            NOTES="$INPUT_NOTES" # override ships verbatim; changelog left untouched
            if [ -f "$CHANGELOG" ] && [ -n "$(extract | tr -d '[:space:]')" ]; then
              echo "::warning::Override used while 'Unreleased' is populated — that section stays queued and will ship + archive with the NEXT release."
            fi
          else
            NOTES=""
            if [ -f "$CHANGELOG" ]; then NOTES="$(extract)"; fi
          fi
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES=""
            echo "::warning::No release notes — 'Unreleased' is empty or missing and no usable override was given; v${VERSION} ships without notes."
          elif [ -z "$INPUT_TRIMMED" ]; then
            # Archive: slide the version header in under '## Unreleased' so the body
            # now belongs to this release and Unreleased is left empty for the next.
            awk -v hdr="## v${VERSION} — $(date -u +%Y-%m-%d)" \
              '$0 ~ ENVIRON["HDR_RE"] {print; print ""; print hdr; next} {print}' \
              "$CHANGELOG" > "$CHANGELOG.tmp" && mv "$CHANGELOG.tmp" "$CHANGELOG"
            ARCHIVED=true
          fi
          DELIM="NOTES_$RANDOM$RANDOM"
          { echo "notes<<$DELIM"; printf '%s\n' "$NOTES"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"
          echo "archived=$ARCHIVED" >> "$GITHUB_OUTPUT"
          # Surface exactly what ships on the run summary so a stale file is caught.
          { echo "## Release notes shipping with this build"; echo; printf '%s\n' "${NOTES:-_none_}"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit + tag on release branch, PR bump back to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
          ARCHIVED: ${{ steps.notes.outputs.archived }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="release/desktop-v${VERSION}"
          git checkout -b "$BRANCH"
          # CHANGELOG.md rides along when the notes step archived Unreleased.
          git add apps/desktop/package.json
          if [ -f apps/desktop/CHANGELOG.md ]; then git add apps/desktop/CHANGELOG.md; fi
          git commit -m "chore(desktop): release v${VERSION}"
          # Tag the BRANCH commit so the build jobs can check it out without waiting
          # on the PR's required checks. Squash-merge rewrites the SHA, so the tag
          # ends up dangling off main — still permanently reachable, still the exact
          # tree the binaries were built from. Tag pushed explicitly: --follow-tags
          # only pushes ANNOTATED tags and this one is lightweight. --atomic so a
          # rejected ref (stale leftovers from a failed run) means nothing pushed.
          git tag "v${VERSION}"
          git push --atomic -u origin "$BRANCH" "refs/tags/v${VERSION}"
          # Past this push, every failure must roll both refs back, or the next
          # dispatch recomputes the same version and dies on the existing tag.
          rollback() {
            git push origin --delete "$BRANCH" || true # also closes the PR
            git push origin --delete "refs/tags/v${VERSION}" || true
          }
          if ! PR_URL=$(gh pr create --title "chore(desktop): release v${VERSION}" \
            --body "Automated version bump from the desktop release workflow. Must land on main or the next release dies on a duplicate tag." \
            --base main --head "$BRANCH"); then
            echo "::error::PR creation failed — rolling back release branch + tag"
            rollback
            exit 1
          fi
          # --auto returns 0 on ENABLE (not merge) and GITHUB_TOKEN PRs never
          # trigger Actions checks, so poll for the actual merge and fail loudly
          # instead of leaving main unbumped; the direct-merge retries cover the
          # clean-status case where GitHub refuses --auto. Branch deletion is the
          # repo's delete_branch_on_merge, not --delete-branch.
          is_merged() { [ "$(gh pr view "$PR_URL" --json state --jq .state)" = "MERGED" ]; }
          gh pr merge "$PR_URL" --squash --auto || true
          MERGED=false
          for _ in $(seq 1 36); do
            gh pr merge "$PR_URL" --squash || true
            if is_merged; then MERGED=true; break; fi
            sleep 5
          done
          if [ "$MERGED" != "true" ] && ! is_merged; then
            echo "::error::Bump PR $PR_URL never merged — rolling back release branch + tag"
            rollback
            exit 1
          fi
          # A concurrent Unreleased edit merges cleanly INTO the archived version
          # section (shipping in no release) — compare main's section to what
          # shipped and warn loudly instead of losing notes silently. Best-effort:
          # never fail the job after the merge has landed.
          if [ "$ARCHIVED" = "true" ]; then
            sleep 3
            if git fetch --quiet origin main; then
              MAIN_SECTION="$(git show origin/main:apps/desktop/CHANGELOG.md 2>/dev/null | awk -v ver="## v${VERSION} " 'index($0, ver) == 1 {f=1; next} $0 ~ ENVIRON["VER_RE"] || $0 ~ ENVIRON["HDR_RE"] {f=0} f')"
              if [ "$(printf '%s' "$MAIN_SECTION" | tr -d '[:space:]')" != "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
                echo "::warning::CHANGELOG section for v${VERSION} on main differs from the shipped notes — a concurrent edit likely landed mid-release; move those lines back under '## Unreleased' so they ship with the next release."
              fi
            else
              echo "::warning::Could not re-fetch main to verify the archived changelog section."
            fi
          fi

  build:
    # Build the selected variants per OS, upload to Vercel Blob, record in the DB. Runs
    # in BOTH modes: bump (needs the version job's fresh tag) and manual (rebuilds an
    # existing tag with the version job skipped).
    needs: [resolve, version]
    # !cancelled() (not always()) so an operator Cancel during resolve/version doesn't
    # still launch a long multi-OS build. version is skipped in manual mode, so accept
    # skipped there while still requiring resolve to have succeeded.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      # version/notes source differs by mode: bump reads the version job's outputs;
      # manual reads resolve's effective_version (the version job is skipped, so its
      # outputs are empty — reading them would checkout `ref: v` and fail the upload).
      - name: Resolve effective build params
        id: params
        shell: bash
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          BUMP_VERSION: ${{ needs.version.outputs.version }}
          BUMP_NOTES: ${{ needs.version.outputs.notes }}
          MANUAL_VERSION: ${{ needs.resolve.outputs.effective_version }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "bump" ]; then
            VER="$BUMP_VERSION"; NOTES="$BUMP_NOTES"
          else
            VER="$MANUAL_VERSION"; NOTES=""
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          D="NOTES_${RANDOM}${RANDOM}" # random delim: notes are arbitrary markdown
          { echo "notes<<$D"; printf '%s\n' "$NOTES"; echo "$D"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: v${{ steps.params.outputs.version }} # the release tag (both modes)
          persist-credentials: false

      # Manual mode rebuilds an OLD tag carrying that tag's OLD upload-release.ts. Overlay
      # the CURRENT publish script (feed guard + timestamped guid) from the dispatched
      # commit via a SECOND authenticated checkout — a raw `git fetch` is unauthenticated
      # after persist-credentials:false and fails on this private repo. Keep
      # upload-release.ts a single self-contained file (only @vercel/blob + node builtins)
      # or this single-file overlay breaks against older tags.
      - name: Fetch current publish script (manual mode)
        if: needs.resolve.outputs.mode == 'manual'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .dispatch-head
          sparse-checkout: apps/desktop/scripts/upload-release.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Apply publish-script overlay (manual mode)
        if: needs.resolve.outputs.mode == 'manual'
        shell: bash
        run: cp .dispatch-head/apps/desktop/scripts/upload-release.ts apps/desktop/scripts/upload-release.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Compile main/preload
        working-directory: apps/desktop
        run: bunx electron-vite build

      # macOS: dmg arm64/x64/universal + universal zip.
      - name: Build installers (mac)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        # Notarize only when Apple creds exist (notarize: true would otherwise hard-fail).
        run: |
          # CSC_IDENTITY_AUTO_DISCOVERY=false DISABLES signing outright —
          # electron-builder ignores CSC_LINK and ad-hoc signs (which then also
          # silently skips notarization). So it must be TRUE when a cert is present
          # and false only to skip cleanly when absent. A set-but-empty CSC_LINK is
          # also a bad cert path, so gate on it being non-empty.
          if [ -n "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          bunx electron-builder --mac --publish never -c.mac.notarize=${{ secrets.APPLE_ID != '' }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Linux: start with the RELIABLE targets (AppImage + deb, x64), growing to
      # rpm/arm64 once each is proven green via a manual dispatch — the full leg has
      # never built. Unsigned. CLI target/arch flags OVERRIDE the tag's
      # electron-builder.yml (AppImage/deb/rpm × x64/arm64), so no config edit is needed;
      # missing runner tooling (fakeroot for deb, rpm for rpm) gets apt-get'd here as
      # failures surface.
      - name: Build installers (linux)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          bunx electron-builder --linux AppImage deb --x64 --publish never

      # Windows System installers FIRST (perMachine) so the per-user build below
      # writes the final latest.yml — electron-updater targets per-user installs.
      - name: Build Windows System installers
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        # bash, not pwsh: PowerShell splits -c.win.artifactName='...' into a bare
        # -c + path, which electron-builder then opens as a config file (ENOENT).
        shell: bash
        run: |
          if [ -n "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          bunx electron-builder --win nsis --x64 --arm64 --publish never -c.nsis.perMachine=true -c.win.artifactName='${productName}-win-${version}-${arch}-system.${ext}'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build Windows User installers
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ -n "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          bunx electron-builder --win nsis --x64 --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload to Blob + record release
        working-directory: apps/desktop
        run: bun scripts/upload-release.ts
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ steps.params.outputs.version }}
          RELEASE_NOTES: ${{ steps.params.outputs.notes }}
          # resolve's downgrade guard: 'true' skips the downloads/latest/ feed mirror.
          RELEASE_SKIP_FEED: ${{ needs.resolve.outputs.skip_feed }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DESKTOP_RELEASE_SECRET: ${{ secrets.DESKTOP_RELEASE_SECRET }}

      # Debug copy on the Actions run (installers only), handy for the first releases.
      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SponsorSearch-${{ matrix.platform }}-v${{ steps.params.outputs.version }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
          if-no-files-found: ignore
          retention-days: 14
