name: HMRC Sponsor List Ingestion

on:
  schedule:
    # 12:30 & 18:00 BST (11:30 & 17:00 GMT)
    - cron: '30 11 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      force-ingest:
        description: "Force ingestion even if CSV hasn't changed"
        type: boolean
        default: false
      allow-shrink:
        description: 'Bypass the volume floor (ingest a feed that shrank >50% since the last run)'
        type: boolean
        default: false
      csv-url:
        description: 'Manual CSV URL to ingest (skips AI discovery). Must be an assets.publishing.service.gov.uk/…/*.csv link — the path changes daily.'
        type: string
        default: ''

jobs:
  # First attempt: local Gemma 4 on a free Apple Silicon runner (paravirtual
  # Metal WebGPU). continue-on-error keeps any gemma failure from failing the
  # scheduled run — the anthropic job below is the fallback.
  discover-csv-url-gemma:
    if: github.event.inputs.csv-url == ''
    runs-on: macos-latest
    timeout-minutes: 15
    continue-on-error: true
    outputs:
      csv-url: ${{ steps.extract-url.outputs.csv-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/web

      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium
        working-directory: apps/web

      # Same derived key as gemma-csv-discovery-test.yaml — a model-pin bump in
      # gemma-litert.ts rolls the key, so cache and pin can never drift.
      - name: Restore Gemma model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: .litert-models
          key: litert-gemma-model-${{ hashFiles('apps/web/scripts/lib/gemma-litert.ts') }}
          enableCrossOsArchive: true

      - name: Run discovery with local Gemma
        env:
          AI_PROVIDER: gemma
          GEMMA_MODEL_PATH: ${{ github.workspace }}/.litert-models/gemma-4-E2B-it-web.litertlm
        run: |
          set -o pipefail
          bun scripts/find-hmrc-csv-url.ts 2>&1 | tee "$RUNNER_TEMP/gemma-out.log"
        working-directory: apps/web

      - name: Save Gemma model cache
        if: always() && steps.model-cache.outputs.cache-hit != 'true' && hashFiles('.litert-models/*.litertlm') != ''
        uses: actions/cache/save@v4
        with:
          path: .litert-models
          key: litert-gemma-model-${{ hashFiles('apps/web/scripts/lib/gemma-litert.ts') }}
          enableCrossOsArchive: true

      - name: Extract CSV URL
        id: extract-url
        # BSD grep (no -P); output read from the tee'd log, never via ${{ }}.
        run: |
          CSV_URL=$(grep -oE 'https://assets\.publishing\.service\.gov\.uk/[^[:space:]]+\.csv([?#][^[:space:]]*)?' "$RUNNER_TEMP/gemma-out.log" | tail -n1 || echo "")
          if [ -z "$CSV_URL" ]; then
            echo "::error::Gemma discovery did not produce a valid gov.uk CSV URL — anthropic fallback will run"
            exit 1
          fi
          echo "csv-url=$CSV_URL" >> "$GITHUB_OUTPUT"
          echo "Gemma found CSV URL: $CSV_URL"

  # Fallback (and the manual csv-url path): runs only when gemma produced no
  # URL — a skipped fallback on the happy path costs nothing.
  discover-csv-url:
    needs: discover-csv-url-gemma
    if: always() && (github.event.inputs.csv-url != '' || needs.discover-csv-url-gemma.outputs.csv-url == '')
    runs-on: ubuntu-latest
    outputs:
      csv-url: ${{ steps.extract-url.outputs.csv-url }}
    steps:
      - name: Checkout repository
        # Skip the clone on the manual path — only find-csv (a local action) needs the repo.
        if: github.event.inputs.csv-url == ''
        uses: actions/checkout@v4

      - name: Find HMRC CSV URL
        id: find-csv
        # Skipped when a manual csv-url is dispatched — no AI call, no cost, and
        # no dependency on the Anthropic account for a hand-fed URL.
        if: github.event.inputs.csv-url == ''
        uses: ./.github/actions/run-playwright-script
        with:
          script-command: bun scripts/find-hmrc-csv-url.ts
          extra-env: |
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            ANTHROPIC_MODEL=${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}

      - name: Extract CSV URL
        id: extract-url
        # Both the AI discovery output AND the manual dispatch URL reach the
        # shell via env, never via ${{ }} in run: — template expansion happens
        # before bash parses, so spliced text (LLM stdout or a hand-entered URL)
        # would execute as code. A manual URL still passes the same gov.uk gate.
        env:
          FIND_CSV_STDOUT: ${{ steps.find-csv.outputs.stdout }}
          MANUAL_CSV_URL: ${{ github.event.inputs.csv-url }}
        run: |
          SOURCE_TEXT="$FIND_CSV_STDOUT"
          if [ -n "$MANUAL_CSV_URL" ]; then SOURCE_TEXT="$MANUAL_CSV_URL"; fi
          CSV_URL=$(echo "$SOURCE_TEXT" | grep -oP 'https://assets\.publishing\.service\.gov\.uk/[^\s]+\.csv([?#][^\s]*)?' | head -n1 || echo "")
          if [ -z "$CSV_URL" ]; then
            if [ -n "$MANUAL_CSV_URL" ]; then
              echo "::error::Manual csv-url did not contain a valid gov.uk CSV URL — fix the link, or re-dispatch with an empty csv-url to fall back to AI discovery"
              echo "Manual input was: $MANUAL_CSV_URL"
            else
              echo "::error::AI discovery output did not contain a valid gov.uk CSV URL"
              echo "Script output was: $FIND_CSV_STDOUT"
            fi
            exit 1
          fi
          echo "csv-url=$CSV_URL" >> "$GITHUB_OUTPUT"
          echo "Found CSV URL: $CSV_URL"

  ingest:
    needs: [discover-csv-url-gemma, discover-csv-url]
    # Runs when either discovery produced a URL (fallback may be skipped on the
    # gemma happy path, hence always() + explicit output check).
    if: always() && (needs.discover-csv-url-gemma.outputs.csv-url != '' || needs.discover-csv-url.outputs.csv-url != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/web

      - name: Run ingestion
        id: ingest
        # URL and flags reach the shell via env (not ${{ }} in run:) so a
        # poisoned discovery output can't inject commands into a step holding
        # POSTGRES_URL and repo-write credentials.
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          # Gemma's URL wins when present; the fallback job carries both the
          # anthropic result and the manual csv-url path.
          CSV_URL: ${{ needs.discover-csv-url-gemma.outputs.csv-url || needs.discover-csv-url.outputs.csv-url }}
          FORCE_INGEST: ${{ github.event.inputs.force-ingest }}
          ALLOW_SHRINK: ${{ github.event.inputs.allow-shrink }}
        run: |
          args=()
          if [ "$FORCE_INGEST" = "true" ]; then args+=(--force); fi
          if [ "$ALLOW_SHRINK" = "true" ]; then args+=(--allow-shrink); fi
          bun run db:ingest "$CSV_URL" "${args[@]}"
        working-directory: apps/web

      - name: Regenerate sitemaps
        if: steps.ingest.outputs.data-changed == 'true'
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: bun run sitemap:generate
        working-directory: apps/web

      - name: Commit updated sitemaps and create PR
        if: steps.ingest.outputs.data-changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/sitemap*.xml
          if git diff --staged --quiet; then
            echo "No sitemap changes to commit"
            exit 0
          fi
          BRANCH="chore/update-sitemaps-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "chore: regenerate sitemaps after ingestion"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --title "chore: regenerate sitemaps after ingestion" --body "Automated sitemap update from HMRC ingestion workflow." --base main)
          # Try auto-merge (queues behind required checks); fall back to direct
          # merge when the PR is already clean and GitHub refuses to enable auto.
          gh pr merge "$PR_URL" --squash --delete-branch --auto \
            || gh pr merge "$PR_URL" --squash --delete-branch
