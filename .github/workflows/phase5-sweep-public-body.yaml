name: Phase 5 Sweep — Tier 4 (public_body)

# Terminal-peer bucket — decide() never auto-trades public_body with a ranked
# state, so this tier's only signal is the public_body_conflict warning (a
# "public body" whose name now resolves to a real CH entity) plus the
# verified_at heartbeat. ~400 rows total; 500/run monthly covers the whole
# bucket in one pass. Most rows short-circuit on the public-body regex with
# zero CH calls, so runs are fast. Scheduled at 14:23 — after every nightly
# tier has finished even on drifted starts (the latest, Tier 3, fires 09:47)
# — because the shared concurrency group keeps only ONE pending run: a second
# pending schedule would evict a queued daily tier run (GitHub cancels the
# older pending run in a group).

on:
  schedule:
    - cron: '23 14 1 * *'
  workflow_dispatch:
    inputs:
      max-rows:
        description: 'Override per-run row limit (default 500)'
        required: false
        type: number
      dry-run:
        description: 'Dry run — no DB writes'
        type: boolean
        default: false

concurrency:
  group: phase5-sweep
  cancel-in-progress: false

# Least privilege by default; jobs that push declare their own elevation.
permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      COMPANIES_HOUSE_SEED_API_KEY: ${{ secrets.COMPANIES_HOUSE_SEED_API_KEY }}
      PHASE5_DELAY_MS: ${{ vars.PHASE5_DELAY_MS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run sweep
        uses: ./.github/actions/run-phase5-sweep
        with:
          tier: public_body
          max-rows: ${{ github.event.inputs.max-rows }}
          dry-run: ${{ github.event.inputs.dry-run }}
