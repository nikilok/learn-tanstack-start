name: Sweep Company Websites

# Nightly liveness pass over company_websites. Fetches each stored URL, checks
# it still resolves, and looks for the company's registered number on the site.
#
# This is what makes a row renderable at all: the render gate is
# `status = 'verified' AND checked_at IS NOT NULL`, and the registry importer
# deliberately leaves checked_at NULL because only 74% of imported URLs actually
# resolve. Until a row has been through here it is identified but not shown.
#
# Own concurrency group, NOT phase5-sweep: GitHub keeps only one pending run per
# group and the five sweep workflows are already staggered to avoid evicting one
# another. This job touches no table they write and makes no Companies House
# calls, so there is nothing to serialise against. 21:43 sits in the long gap
# between the 17:00 ingest and the 01:17 tier-1 sweep.

on:
  schedule:
    - cron: '43 21 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run — fetch and decide, no DB writes'
        type: boolean
        default: false
      max-rows:
        description: 'Rows to process this run (default 900)'
        required: false
        type: number

concurrency:
  group: sweep-websites
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This job never pushes, so it has no use for a credential that
          # actions/checkout would otherwise leave in the local git config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        shell: bash
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Sweep websites
        shell: bash
        # Inputs go through env, never interpolated into the run script.
        # POSTGRES_URL is scoped to this step rather than the job: at job level
        # it is also readable by actions/checkout, setup-bun and every
        # postinstall script `bun install` executes.
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
          MAX_ROWS: ${{ github.event.inputs.max-rows }}
        run: |
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          ROWS_FLAG=""
          if [ -n "$MAX_ROWS" ]; then
            ROWS_FLAG="--max-rows=$MAX_ROWS"
          fi
          set -o pipefail
          bun apps/web/scripts/sweep-websites.ts $DRY_FLAG $ROWS_FLAG | tee /tmp/sweep-websites.log

      - name: Purge company-pages edge cache
        # The sweep is the once-daily writer that changes what company pages
        # render, so one population-tag invalidation after it is the whole
        # freshness story (docs/company-pages-cache.md). invalidateByTags marks
        # entries stale for background revalidation — gentler than a deploy's
        # full purge. always(): the sweep writes promotions incrementally, so
        # even a failed or timed-out run has changes worth publishing.
        # 200 {purged:true} is the ONLY success. The endpoint answers a
        # neutral 202 to a bad secret BY DESIGN (no auth signal to probes),
        # but 202 != 200 tells THIS caller; and 200 {purged:false} means
        # VERCEL_CACHE_INVALIDATION is off in prod. Both fail the step
        # instead of green-no-op'ing, as does a 500 from an API failure.
        if: always() && github.event.inputs.dry-run != 'true'
        shell: bash
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          [ -n "$REVALIDATE_SECRET" ] || { echo "REVALIDATE_SECRET is not set"; exit 1; }
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            "https://sponsorsearch.co.uk/api/revalidate?purge=company-pages") || exit $?
          [ "$status" = "200" ] || { echo "Expected 200, got $status"; cat "$body"; exit 1; }
          jq -e '.purged == true' "$body" >/dev/null || { echo "Purge did not run"; cat "$body"; exit 1; }

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          LOG=/tmp/sweep-websites.log
          if [ ! -f "$LOG" ]; then exit 0; fi
          extract() { grep -E "^  $1 +:" "$LOG" | tail -n1 | sed -E "s/^  $1 +: //" || true; }
          {
            echo "## Website Revalidation Sweep"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| 🎯 Selected | $(extract selected) |"
            echo "| ✅ Live | $(extract live) |"
            echo "| 💀 Newly dead | $(extract dead) |"
            echo "| 🤖 Robots blocked | $(extract robots_blocked) |"
            echo "| ⬆️ Promoted | $(extract promoted) |"
            echo "| 🔀 Adopted variant | $(extract adopted_variant) |"
            echo "| 📄 Disclosure fetches | $(extract disclosure_fetches) |"
            echo "| 🪪 Name corroborated | $(extract corroborated) |"
            echo "| ⬇️ Demoted | $(extract demoted) |"
            echo "| 🚧 No site there | $(extract no_site_there) |"
            echo "| 💾 Updated | $(extract updated) |"
            echo "| ❌ Errored | $(extract errored) |"
            echo "| ⏳ Never checked left | $(extract never_checked_left) |"
            echo "| 🌐 Sponsors renderable | $(extract sponsor_renderable) |"
            echo "| ⏱️ Duration | $(extract duration) |"
          } >> "$GITHUB_STEP_SUMMARY"
