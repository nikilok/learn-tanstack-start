appId: uk.co.sponsorsearch.desktop
productName: SponsorSearch
copyright: © SponsorSearch

directories:
  buildResources: build
  output: dist

# The main process bundle (out/) is self-contained — electron-updater is bundled
# in by Vite — so no node_modules need to be packed.
files:
  - out/**
  - package.json

# ${version} in every artifactName is REQUIRED for electron-updater differential
# updates: the old-blockmap URL is derived by substituting the previous version
# into the new file's URL — a no-op on version-less names, which silently breaks
# diffing and forces full downloads.
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [arm64, x64, universal]
    - target: zip # per-arch zips drive electron-updater: it matches process.arch (arm64/x64), never "universal", so a universal-only zip is never picked
      arch: [arm64, x64]
  artifactName: ${productName}-mac-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true # uses APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID (or APPLE_API_KEY*)

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # This (default) build is the per-user installer; the release workflow runs a
  # second pass with -c.nsis.perMachine=true + a '-system' artifactName override
  # for the System installers. '-user' keeps filenames unique + parseable.
  artifactName: ${productName}-win-${version}-${arch}-user.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Default true builds an EXTRA arch-less "universal" exe per scope, which the
  # upload parser reads as x64 — colliding with the real x64 row on the variant
  # unique index. Per-arch installers only.
  buildUniversalInstaller: false

linux:
  category: Office
  # Linux derives the binary name from package.json "name" (NOT productName);
  # "@ss/desktop" sanitizes to "@ssdesktop", which AppImage rejects.
  executableName: sponsorsearch
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  artifactName: ${productName}-linux-${version}-${arch}.${ext}

# Self-hosted feed: electron-updater fetches latest*.yml (+ the installer) from
# this stable base, which the Nitro /downloads/latest/ route redirects to Blob.
# Build with --publish never; the workflow uploads dist/* to Blob itself.
publish:
  provider: generic
  url: https://sponsorsearch.co.uk/downloads/latest/
