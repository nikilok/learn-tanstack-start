[install]
# Refuse to install package versions younger than 3 days. Mitigates supply-chain
# attacks where compromised releases are typically caught and yanked within hours.
minimumReleaseAge = 259200
# Types-only mirrors of the bun runtime; they must move the day bun does.
minimumReleaseAgeExcludes = ["@types/bun", "bun-types", "@nikilok/thoth-engine"]

[install.scopes]
# The Ask engine comes from GitHub Packages; the token is read-only and lives
# in the environment (Vercel, CI), never here.
"@nikilok" = { url = "https://npm.pkg.github.com", token = "$GITHUB_PACKAGES_TOKEN" }
